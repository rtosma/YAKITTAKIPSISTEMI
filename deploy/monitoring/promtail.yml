# ==============================================================================
# OPS-1107 — Promtail: compose konteyner loglarını Docker API üzerinden okuyup Loki'ye gönderir
# (dosya bağlama gerekmez → rootless Docker'da da çalışır; docker.sock salt-okunur bağlanır).
# Çalıştırma: -config.expand-env=true (COMPOSE_PROJECT_NAME ile yalnızca bu yığının konteynerleri).
# ==============================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: compose
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=${COMPOSE_PROJECT_NAME}"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
    pipeline_stages:
      # Backend (pino) her satırı JSON yazar: level/msg/traceId/tenantId/req/res/responseTime ...
      - match:
          selector: '{service="backend"}'
          stages:
            - json:
                expressions:
                  level: level
                  time: time
                  traceId: traceId
                  tenantId: tenantId
            - timestamp:
                source: time
                format: RFC3339
            # ETİKET: yalnızca sınırlı küme (trace|debug|info|warn|error|fatal).
            - labels:
                level:
            # Aranabilir ama İNDEKSLENMEYEN (kardinalite güvenli): `{service="backend"} | traceId="..."`
            - structured_metadata:
                traceId:
                tenantId:
