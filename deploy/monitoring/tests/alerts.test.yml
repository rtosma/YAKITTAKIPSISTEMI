# OPS-1108 — ÜRETİLDİ (scripts/monitoring/generate-rule-tests.mjs; kaynak: rules/*.yml + alert-scenarios.mjs). ELLE DÜZENLEMEYİN.
# Çalıştırma: promtool test rules deploy/monitoring/tests/alerts.test.yml
rule_files:
  - "../rules/api.yml"
  - "../rules/infra.yml"
  - "../rules/field.yml"
  - "../rules/meta.yml"
evaluation_interval: "1m"
tests:
  - interval: "1m"
    input_series:
      - series: "http_requests_total{status=\"200\",route=\"/x\"}"
        values: "0+1000x60"

      - series: "http_requests_total{status=\"500\",route=\"/x\"}"
        values: "0+50x60"

    alert_rule_test:
      - eval_time: "20m"
        alertname: "ApiErrorRate"
        exp_alerts:
          - exp_labels:
              severity: "warning"
              domain: "api"
            exp_annotations:
              summary: "API 5xx hata oranı %2'yi aştı"
              description: "Son 5 dk 5xx oranı 0.048 (eşik 0.02, ≥0.2 istek/sn trafikte)."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/api.md#apierrorrate"


    name: "ApiErrorRate: warning: %4.8 hata"

  - interval: "1m"
    input_series:
      - series: "http_requests_total{status=\"200\",route=\"/x\"}"
        values: "0+1000x60"

      - series: "http_requests_total{status=\"500\",route=\"/x\"}"
        values: "0+150x60"

    alert_rule_test:
      - eval_time: "20m"
        alertname: "ApiErrorRate"
        exp_alerts:
          - exp_labels:
              severity: "critical"
              domain: "api"
            exp_annotations:
              summary: "API 5xx hata oranı %10'u aştı — kullanıcılar etkileniyor"
              description: "Son 5 dk 5xx oranı 0.130 (eşik 0.10)."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/api.md#apierrorrate"

          - exp_labels:
              severity: "warning"
              domain: "api"
            exp_annotations:
              summary: "API 5xx hata oranı %2'yi aştı"
              description: "Son 5 dk 5xx oranı 0.130 (eşik 0.02, ≥0.2 istek/sn trafikte)."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/api.md#apierrorrate"


    name: "ApiErrorRate: critical: %14.3 hata (warning de aktif; Alertmanager bastırır)"

  - interval: "1m"
    input_series:
      - series: "http_requests_total{status=\"200\",route=\"/x\"}"
        values: "0+1000x60"

      - series: "http_requests_total{status=\"500\",route=\"/x\"}"
        values: "0+10x60"

    alert_rule_test:
      - eval_time: "20m"
        alertname: "ApiErrorRate"
        exp_alerts: []

    name: "ApiErrorRate: sessiz: %1 hata"

  - interval: "1m"
    input_series:
      - series: "http_requests_total{status=\"200\",route=\"/x\"}"
        values: "0+2x60"

      - series: "http_requests_total{status=\"500\",route=\"/x\"}"
        values: "0+1x60"

    alert_rule_test:
      - eval_time: "20m"
        alertname: "ApiErrorRate"
        exp_alerts: []

    name: "ApiErrorRate: sessiz: asgari trafik koruması (oran %33 ama 0.05 istek/sn)"

  - interval: "1m"
    input_series:
      - series: "http_requests_total{status=\"200\",route=\"/x\"}"
        values: "0+1000x60"

      - series: "http_requests_total{status=\"500\",route=\"/x\"}"
        values: "0+50x60"

    alert_rule_test:
      - eval_time: "9m"
        alertname: "ApiErrorRate"
        exp_alerts: []

    name: "ApiErrorRate: sessiz: `for` dolmadı (9 dk)"

  - interval: "1m"
    input_series:
      - series: "http_requests_total{status=\"200\",route=\"/x\"}"
        values: "0+1000x60"

      - series: "http_request_duration_seconds_bucket{le=\"0.5\"}"
        values: "0+900x60"

      - series: "http_request_duration_seconds_bucket{le=\"1\"}"
        values: "0+900x60"

      - series: "http_request_duration_seconds_bucket{le=\"2.5\"}"
        values: "0+1000x60"

      - series: "http_request_duration_seconds_bucket{le=\"5\"}"
        values: "0+1000x60"

      - series: "http_request_duration_seconds_bucket{le=\"10\"}"
        values: "0+1000x60"

      - series: "http_request_duration_seconds_bucket{le=\"+Inf\"}"
        values: "0+1000x60"

    alert_rule_test:
      - eval_time: "20m"
        alertname: "ApiLatencyP95"
        exp_alerts:
          - exp_labels:
              severity: "warning"
              domain: "api"
            exp_annotations:
              summary: "API p95 gecikmesi 1 sn'yi aştı"
              description: "Son 5 dk p95 = 1.75 sn (eşik 1)."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/api.md#apilatencyp95"


    name: "ApiLatencyP95: warning: p95 = 1.75 sn"

  - interval: "1m"
    input_series:
      - series: "http_requests_total{status=\"200\",route=\"/x\"}"
        values: "0+1000x60"

      - series: "http_request_duration_seconds_bucket{le=\"0.5\"}"
        values: "0+900x60"

      - series: "http_request_duration_seconds_bucket{le=\"1\"}"
        values: "0+900x60"

      - series: "http_request_duration_seconds_bucket{le=\"2.5\"}"
        values: "0+900x60"

      - series: "http_request_duration_seconds_bucket{le=\"5\"}"
        values: "0+900x60"

      - series: "http_request_duration_seconds_bucket{le=\"10\"}"
        values: "0+1000x60"

      - series: "http_request_duration_seconds_bucket{le=\"+Inf\"}"
        values: "0+1000x60"

    alert_rule_test:
      - eval_time: "20m"
        alertname: "ApiLatencyP95"
        exp_alerts:
          - exp_labels:
              severity: "critical"
              domain: "api"
            exp_annotations:
              summary: "API p95 gecikmesi 3 sn'yi aştı — sistem fiilen yanıt vermiyor"
              description: "Son 5 dk p95 = 7.50 sn (eşik 3)."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/api.md#apilatencyp95"

          - exp_labels:
              severity: "warning"
              domain: "api"
            exp_annotations:
              summary: "API p95 gecikmesi 1 sn'yi aştı"
              description: "Son 5 dk p95 = 7.50 sn (eşik 1)."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/api.md#apilatencyp95"


    name: "ApiLatencyP95: critical: p95 = 7.5 sn"

  - interval: "1m"
    input_series:
      - series: "http_requests_total{status=\"200\",route=\"/x\"}"
        values: "0+1000x60"

      - series: "http_request_duration_seconds_bucket{le=\"0.5\"}"
        values: "0+1000x60"

      - series: "http_request_duration_seconds_bucket{le=\"1\"}"
        values: "0+1000x60"

      - series: "http_request_duration_seconds_bucket{le=\"2.5\"}"
        values: "0+1000x60"

      - series: "http_request_duration_seconds_bucket{le=\"5\"}"
        values: "0+1000x60"

      - series: "http_request_duration_seconds_bucket{le=\"10\"}"
        values: "0+1000x60"

      - series: "http_request_duration_seconds_bucket{le=\"+Inf\"}"
        values: "0+1000x60"

    alert_rule_test:
      - eval_time: "20m"
        alertname: "ApiLatencyP95"
        exp_alerts: []

    name: "ApiLatencyP95: sessiz: hepsi ≤0.5 sn"

  - interval: "1m"
    input_series:
      - series: "nodejs_eventloop_lag_p99_seconds"
        values: "0.75+0x60"

    alert_rule_test:
      - eval_time: "10m"
        alertname: "EventLoopLag"
        exp_alerts:
          - exp_labels:
              severity: "warning"
              domain: "api"
            exp_annotations:
              summary: "Node.js event loop gecikmesi p99 > 500 ms"
              description: "Event loop p99 gecikmesi 0.75 sn — senkron/CPU-yoğun iş tüm istekleri geciktiriyor."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/api.md#eventlooplag"


    name: "EventLoopLag: warning: p99 = 0.75 sn"

  - interval: "1m"
    input_series:
      - series: "nodejs_eventloop_lag_p99_seconds"
        values: "0.75+0x60"

    alert_rule_test:
      - eval_time: "4m"
        alertname: "EventLoopLag"
        exp_alerts: []

    name: "EventLoopLag: warning: p99 = 0.75 sn — for dolmadan (4 dk) ateşlemez"

  - interval: "1m"
    input_series:
      - series: "nodejs_eventloop_lag_p99_seconds"
        values: "0.05+0x60"

    alert_rule_test:
      - eval_time: "10m"
        alertname: "EventLoopLag"
        exp_alerts: []

    name: "EventLoopLag: sessiz: 50 ms"

  - interval: "1m"
    input_series:
      - series: "up{job=\"backend\",instance=\"b1:5000\"}"
        values: "0+0x60"

    alert_rule_test:
      - eval_time: "5m"
        alertname: "BackendDown"
        exp_alerts:
          - exp_labels:
              severity: "critical"
              domain: "api"
              job: "backend"
              instance: "b1:5000"
            exp_annotations:
              summary: "Backend örneği kazınamıyor (uptime)"
              description: "b1:5000 2 dk'dır /metrics'e yanıt vermiyor: süreç çökmüş, yeniden başlıyor veya ağ kopuk."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/api.md#backenddown"


    name: "BackendDown: critical: up=0"

  - interval: "1m"
    input_series:
      - series: "up{job=\"backend\",instance=\"b1:5000\"}"
        values: "1+0x60"

    alert_rule_test:
      - eval_time: "5m"
        alertname: "BackendDown"
        exp_alerts: []

    name: "BackendDown: sessiz: up=1"

  - interval: "1m"
    input_series:
      - series: "up{job=\"backend\",instance=\"b1:5000\"}"
        values: "0+0x60"

    alert_rule_test:
      - eval_time: "1m"
        alertname: "BackendDown"
        exp_alerts: []

    name: "BackendDown: sessiz: `for` dolmadı (1 dk)"

  - interval: "1m"
    input_series:
      - series: "up{job=\"node\",instance=\"n1:9100\"}"
        values: "1+0x60"

    alert_rule_test:
      - eval_time: "10m"
        alertname: "BackendMissing"
        exp_alerts:
          - exp_labels:
              severity: "critical"
              domain: "api"
              job: "backend"
            exp_annotations:
              summary: "Backend hedefi Prometheus'tan tamamen kayboldu"
              description: "up{job=\"backend\"} serisi 5 dk'dır yok: servis keşfi (DNS) boş — tüm replikalar kapalı olabilir. (up==0 bu durumda ateşlemez.)"
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/api.md#backendmissing"


    name: "BackendMissing: critical: backend serisi yok (DNS SD boş)"

  - interval: "1m"
    input_series:
      - series: "up{job=\"backend\",instance=\"b1:5000\"}"
        values: "1+0x60"

    alert_rule_test:
      - eval_time: "10m"
        alertname: "BackendMissing"
        exp_alerts: []

    name: "BackendMissing: sessiz: backend var"

  - interval: "1m"
    input_series:
      - series: "process_resident_memory_bytes{job=\"backend\"}"
        values: "2000000000+0x60"

    alert_rule_test:
      - eval_time: "25m"
        alertname: "BackendMemoryHigh"
        exp_alerts:
          - exp_labels:
              severity: "warning"
              domain: "api"
            exp_annotations:
              summary: "Backend RSS belleği 1.5 GB'ı aştı (sızıntı şüphesi)"
              description: "RSS 2000000000 bayt; kalıcı artış OOM-kill riskidir."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/api.md#backendmemoryhigh"


    name: "BackendMemoryHigh: warning: 2 GB RSS"

  - interval: "1m"
    input_series:
      - series: "process_resident_memory_bytes{job=\"backend\"}"
        values: "500000000+0x60"

    alert_rule_test:
      - eval_time: "25m"
        alertname: "BackendMemoryHigh"
        exp_alerts: []

    name: "BackendMemoryHigh: sessiz: 500 MB"

  - interval: "1m"
    input_series:
      - series: "yakit_db_pool_connections{state=\"waiting\"}"
        values: "3+0x60"

    alert_rule_test:
      - eval_time: "5m"
        alertname: "DbPoolSaturated"
        exp_alerts:
          - exp_labels:
              severity: "warning"
              domain: "database"
            exp_annotations:
              summary: "Uygulama DB havuzunda bağlantı bekleyen istek var"
              description: "3 istek havuzdan bağlantı bekliyor (havuz 10 bağlantı)."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/database.md#dbpoolsaturated"


    name: "DbPoolSaturated: warning: 3 bekleyen"

  - interval: "1m"
    input_series:
      - series: "yakit_db_pool_connections{state=\"waiting\"}"
        values: "3+0x60"

    alert_rule_test:
      - eval_time: "1m"
        alertname: "DbPoolSaturated"
        exp_alerts: []

    name: "DbPoolSaturated: warning: 3 bekleyen — for dolmadan (1 dk) ateşlemez"

  - interval: "1m"
    input_series:
      - series: "yakit_db_pool_connections{state=\"waiting\"}"
        values: "8+0x60"

    alert_rule_test:
      - eval_time: "5m"
        alertname: "DbPoolSaturated"
        exp_alerts:
          - exp_labels:
              severity: "critical"
              domain: "database"
            exp_annotations:
              summary: "DB bağlantı havuzu doygun — istekler zaman aşımına düşüyor"
              description: "8 istek bekliyor; connectionTimeout (10 sn) sonrası 503 üretilir."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/database.md#dbpoolsaturated"

          - exp_labels:
              severity: "warning"
              domain: "database"
            exp_annotations:
              summary: "Uygulama DB havuzunda bağlantı bekleyen istek var"
              description: "8 istek havuzdan bağlantı bekliyor (havuz 10 bağlantı)."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/database.md#dbpoolsaturated"


    name: "DbPoolSaturated: critical: 8 bekleyen"

  - interval: "1m"
    input_series:
      - series: "yakit_db_pool_connections{state=\"waiting\"}"
        values: "0+0x60"

    alert_rule_test:
      - eval_time: "5m"
        alertname: "DbPoolSaturated"
        exp_alerts: []

    name: "DbPoolSaturated: sessiz: bekleyen yok"

  - interval: "1m"
    input_series:
      - series: "pg_stat_activity_count{state=\"active\"}"
        values: "85+0x60"

      - series: "pg_settings_max_connections"
        values: "100+0x60"

    alert_rule_test:
      - eval_time: "10m"
        alertname: "PostgresConnectionsHigh"
        exp_alerts:
          - exp_labels:
              severity: "warning"
              domain: "database"
            exp_annotations:
              summary: "PostgreSQL bağlantıları max_connections'ın %80'ini aştı"
              description: "Kullanım oranı 0.85 (eşik 0.80)."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/database.md#postgresconnectionshigh"


    name: "PostgresConnectionsHigh: warning: %85"

  - interval: "1m"
    input_series:
      - series: "pg_stat_activity_count{state=\"active\"}"
        values: "85+0x60"

      - series: "pg_settings_max_connections"
        values: "100+0x60"

    alert_rule_test:
      - eval_time: "4m"
        alertname: "PostgresConnectionsHigh"
        exp_alerts: []

    name: "PostgresConnectionsHigh: warning: %85 — for dolmadan (4 dk) ateşlemez"

  - interval: "1m"
    input_series:
      - series: "pg_stat_activity_count{state=\"active\"}"
        values: "95+0x60"

      - series: "pg_settings_max_connections"
        values: "100+0x60"

    alert_rule_test:
      - eval_time: "10m"
        alertname: "PostgresConnectionsHigh"
        exp_alerts:
          - exp_labels:
              severity: "critical"
              domain: "database"
            exp_annotations:
              summary: "PostgreSQL bağlantıları max_connections'ın %90'ını aştı — yeni bağlantılar reddedilecek"
              description: "Kullanım oranı 0.95 (eşik 0.90)."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/database.md#postgresconnectionshigh"

          - exp_labels:
              severity: "warning"
              domain: "database"
            exp_annotations:
              summary: "PostgreSQL bağlantıları max_connections'ın %80'ini aştı"
              description: "Kullanım oranı 0.95 (eşik 0.80)."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/database.md#postgresconnectionshigh"


    name: "PostgresConnectionsHigh: critical: %95"

  - interval: "1m"
    input_series:
      - series: "pg_stat_activity_count{state=\"active\"}"
        values: "30+0x60"

      - series: "pg_settings_max_connections"
        values: "100+0x60"

    alert_rule_test:
      - eval_time: "10m"
        alertname: "PostgresConnectionsHigh"
        exp_alerts: []

    name: "PostgresConnectionsHigh: sessiz: %30"

  - interval: "1m"
    input_series:
      - series: "pg_up"
        values: "0+0x60"

    alert_rule_test:
      - eval_time: "5m"
        alertname: "PostgresDown"
        exp_alerts:
          - exp_labels:
              severity: "critical"
              domain: "database"
            exp_annotations:
              summary: "PostgreSQL'e ulaşılamıyor"
              description: "postgres-exporter veritabanına bağlanamıyor (pg_up=0) — DB durmuş veya erişim/kimlik hatası."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/database.md#postgresdown"


    name: "PostgresDown: critical: pg_up=0"

  - interval: "1m"
    input_series:
      - series: "pg_up"
        values: "0+0x60"

    alert_rule_test:
      - eval_time: "1m"
        alertname: "PostgresDown"
        exp_alerts: []

    name: "PostgresDown: critical: pg_up=0 — for dolmadan (1 dk) ateşlemez"

  - interval: "1m"
    input_series:
      - series: "pg_up"
        values: "1+0x60"

    alert_rule_test:
      - eval_time: "5m"
        alertname: "PostgresDown"
        exp_alerts: []

    name: "PostgresDown: sessiz: pg_up=1"

  - interval: "1m"
    input_series:
      - series: "node_filesystem_avail_bytes{mountpoint=\"/\",fstype=\"ext4\"}"
        values: "10+0x60"

      - series: "node_filesystem_size_bytes{mountpoint=\"/\",fstype=\"ext4\"}"
        values: "100+0x60"

    alert_rule_test:
      - eval_time: "15m"
        alertname: "DiskSpace"
        exp_alerts:
          - exp_labels:
              severity: "warning"
              domain: "infra"
              mountpoint: "/"
              fstype: "ext4"
            exp_annotations:
              summary: "Disk %85 doldu (/)"
              description: "/ boş oranı 0.10 (eşik 0.15)."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/infrastructure.md#diskspace"


    name: "DiskSpace: warning: %10 boş"

  - interval: "1m"
    input_series:
      - series: "node_filesystem_avail_bytes{mountpoint=\"/\",fstype=\"ext4\"}"
        values: "10+0x60"

      - series: "node_filesystem_size_bytes{mountpoint=\"/\",fstype=\"ext4\"}"
        values: "100+0x60"

    alert_rule_test:
      - eval_time: "9m"
        alertname: "DiskSpace"
        exp_alerts: []

    name: "DiskSpace: warning: %10 boş — for dolmadan (9 dk) ateşlemez"

  - interval: "1m"
    input_series:
      - series: "node_filesystem_avail_bytes{mountpoint=\"/\",fstype=\"ext4\"}"
        values: "3+0x60"

      - series: "node_filesystem_size_bytes{mountpoint=\"/\",fstype=\"ext4\"}"
        values: "100+0x60"

    alert_rule_test:
      - eval_time: "15m"
        alertname: "DiskSpace"
        exp_alerts:
          - exp_labels:
              severity: "critical"
              domain: "infra"
              mountpoint: "/"
              fstype: "ext4"
            exp_annotations:
              summary: "Disk %95 doldu (/) — yazma hataları/veritabanı durması yakın"
              description: "/ boş oranı 0.03 (eşik 0.05)."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/infrastructure.md#diskspace"

          - exp_labels:
              severity: "warning"
              domain: "infra"
              mountpoint: "/"
              fstype: "ext4"
            exp_annotations:
              summary: "Disk %85 doldu (/)"
              description: "/ boş oranı 0.03 (eşik 0.15)."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/infrastructure.md#diskspace"


    name: "DiskSpace: critical: %3 boş"

  - interval: "1m"
    input_series:
      - series: "node_filesystem_avail_bytes{mountpoint=\"/\",fstype=\"ext4\"}"
        values: "40+0x60"

      - series: "node_filesystem_size_bytes{mountpoint=\"/\",fstype=\"ext4\"}"
        values: "100+0x60"

    alert_rule_test:
      - eval_time: "15m"
        alertname: "DiskSpace"
        exp_alerts: []

    name: "DiskSpace: sessiz: %40 boş"

  - interval: "1m"
    input_series:
      - series: "node_filesystem_avail_bytes{mountpoint=\"/run\",fstype=\"tmpfs\"}"
        values: "1+0x60"

      - series: "node_filesystem_size_bytes{mountpoint=\"/run\",fstype=\"tmpfs\"}"
        values: "100+0x60"

    alert_rule_test:
      - eval_time: "15m"
        alertname: "DiskSpace"
        exp_alerts: []

    name: "DiskSpace: sessiz: tmpfs yok sayılır"

  - interval: "1m"
    input_series:
      - series: "node_filesystem_avail_bytes{mountpoint=\"/\",fstype=\"ext4\"}"
        values: "800000000-5000000x120"

      - series: "node_filesystem_size_bytes{mountpoint=\"/\",fstype=\"ext4\"}"
        values: "2000000000+0x120"

    alert_rule_test:
      - eval_time: "90m"
        alertname: "DiskWillFillSoon"
        exp_alerts:
          - exp_labels:
