    name: "Watchdog: her zaman ateşler (kalp atışı)"

  - interval: "1m"
    input_series:
      - series: "up{job=\"node\",instance=\"n1:9100\"}"
        values: "0+0x60"

    alert_rule_test:
      - eval_time: "10m"
        alertname: "ScrapeTargetDown"
        exp_alerts:
          - exp_labels:
              severity: "warning"
              domain: "meta"
              job: "node"
              instance: "n1:9100"
            exp_annotations:
              summary: "İzleme hedefi kazınamıyor (node)"
              description: "node hedefi 5 dk'dır up=0 — o bileşenin metrikleri/uyarıları körleşmiş olabilir."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/monitoring.md#scrapetargetdown"


    name: "ScrapeTargetDown: warning: node hedefi down"

  - interval: "1m"
    input_series:
      - series: "up{job=\"node\",instance=\"n1:9100\"}"
        values: "1+0x60"

    alert_rule_test:
      - eval_time: "10m"
        alertname: "ScrapeTargetDown"
        exp_alerts: []

    name: "ScrapeTargetDown: sessiz: hedefler up"

  - interval: "1m"
    input_series:
      - series: "up{job=\"backend\",instance=\"b1:5000\"}"
        values: "0+0x60"

    alert_rule_test:
      - eval_time: "10m"
        alertname: "ScrapeTargetDown"
        exp_alerts: []

    name: "ScrapeTargetDown: sessiz: backend down bu kuralın konusu DEĞİL (BackendDown)"

  - interval: "1m"
    input_series:
      - series: "yakit_business_metrics_last_refresh_timestamp_seconds"
        values: "100+0x60"

    alert_rule_test:
      - eval_time: "20m"
        alertname: "BusinessMetricsStale"
        exp_alerts:
          - exp_labels:
              severity: "warning"
              domain: "meta"
            exp_annotations:
              summary: "İş metrikleri 5 dk'dır yenilenmiyor (cihaz/alarm/kuyruk uyarıları bayat veriye bakıyor)"
              description: "Son başarılı yenilemeden bu yana 1100 sn geçti."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/monitoring.md#businessmetricsstale"


    name: "BusinessMetricsStale: warning: son yenileme 1100 sn önce"

  - interval: "1m"
    input_series:
      - series: "yakit_business_metrics_last_refresh_timestamp_seconds"
        values: "0+60x60"

    alert_rule_test:
      - eval_time: "20m"
        alertname: "BusinessMetricsStale"
        exp_alerts: []

    name: "BusinessMetricsStale: sessiz: taze (zamanla artan)"

  - interval: "1m"
    input_series:
      - series: "up{job=\"loki\",instance=\"l1:3100\"}"
        values: "0+0x60"

    alert_rule_test:
      - eval_time: "10m"
        alertname: "LogPipelineDown"
        exp_alerts:
          - exp_labels:
              severity: "warning"
              domain: "meta"
              job: "loki"
              instance: "l1:3100"
            exp_annotations:
              summary: "Merkezi log deposu (Loki) erişilemiyor"
              description: "Loki 5 dk'dır kazınamıyor — loglar toplanmıyor/aranamıyor olabilir."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/monitoring.md#logpipelinedown"


    name: "LogPipelineDown: warning: loki down"

  - interval: "1m"
    input_series:
      - series: "up{job=\"loki\",instance=\"l1:3100\"}"
        values: "1+0x60"

    alert_rule_test:
      - eval_time: "10m"
        alertname: "LogPipelineDown"
        exp_alerts: []

    name: "LogPipelineDown: sessiz: loki up"

  - interval: "1m"
    input_series:
      - series: "yakit_backup_last_success_timestamp_seconds{kind=\"base\"}"
        values: "0+0x1600"

    alert_rule_test:
      - eval_time: "1600m"
        alertname: "BackupTooOld"
        exp_alerts:
          - exp_labels:
              severity: "critical"
              domain: "backup"
            exp_annotations:
              summary: "Son başarılı günlük yedek 26 saatten eski"
              description: "Son başarılı tam yedekten bu yana 96000 sn geçti — günlük yedek çalışmıyor/başarısız (OPS-1106)."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/backup.md#backuptooold"


    name: "BackupTooOld: critical: son yedek 96000 sn önce"

  - interval: "1m"
    input_series:
      - series: "yakit_backup_last_success_timestamp_seconds{kind=\"base\"}"
        values: "0+0x100"

    alert_rule_test:
      - eval_time: "60m"
        alertname: "BackupTooOld"
        exp_alerts: []

    name: "BackupTooOld: sessiz: taze yedek"

  - interval: "1m"
    input_series:
      - series: "dummy_metric"
        values: "1+0x60"

    alert_rule_test:
      - eval_time: "90m"
        alertname: "BackupMetricsMissing"
        exp_alerts:
          - exp_labels:
              severity: "warning"
              domain: "backup"
              kind: "base"
            exp_annotations:
              summary: "Yedek metrikleri hiç görünmüyor (yedek programı kurulu değil olabilir)"
              description: "yakit_backup_last_success_timestamp_seconds{kind=\"base\"} yok: BACKUP_METRICS_DIR/textfile toplayıcı yapılandırılmamış veya yedek hiç çalışmadı."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/backup.md#backupmetricsmissing"


    name: "BackupMetricsMissing: warning: yedek metriği hiç yok"

  - interval: "1m"
    input_series:
      - series: "yakit_backup_last_success_timestamp_seconds{kind=\"base\"}"
        values: "0+0x100"

    alert_rule_test:
      - eval_time: "90m"
        alertname: "BackupMetricsMissing"
        exp_alerts: []

    name: "BackupMetricsMissing: sessiz: metrik var"

  - interval: "1m"
    input_series:
      - series: "yakit_backup_last_success_timestamp_seconds{kind=\"wal\"}"
        values: "0+0x60"

    alert_rule_test:
      - eval_time: "30m"
        alertname: "WalShippingStalled"
        exp_alerts:
          - exp_labels:
              severity: "critical"
              domain: "backup"
            exp_annotations:
              summary: "WAL arşiv gönderimi 15 dk'dır durdu — RPO hedefi (15 dk) aşılıyor"
              description: "Son başarılı WAL gönderiminden bu yana 1800 sn geçti (RPO 900 sn)."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/backup.md#walshippingstalled"


    name: "WalShippingStalled: critical: son WAL gönderimi 1800 sn önce"

  - interval: "1m"
    input_series:
      - series: "yakit_backup_last_success_timestamp_seconds{kind=\"wal\"}"
        values: "0+60x60"

    alert_rule_test:
      - eval_time: "30m"
        alertname: "WalShippingStalled"
        exp_alerts: []

    name: "WalShippingStalled: sessiz: taze WAL gönderimi"

  - interval: "1m"
    input_series:
      - series: "yakit_wal_spool_pending_files"
        values: "25+0x60"

    alert_rule_test:
      - eval_time: "20m"
        alertname: "WalSpoolBacklog"
        exp_alerts:
          - exp_labels:
              severity: "warning"
              domain: "backup"
            exp_annotations:
              summary: "WAL spool'unda taşınmamış segment birikti (>20)"
              description: "25 segment volume'da bekliyor — gönderici çalışmıyor; volume dolarsa arşiv durur ve DB yazmayı durdurabilir."
              runbook_url: "https://github.com/rtosma/YAKITTAKIPSISTEMI/blob/main/docs/runbooks/backup.md#walspoolbacklog"


    name: "WalSpoolBacklog: warning: 25 bekleyen segment"

  - interval: "1m"
    input_series:
      - series: "yakit_wal_spool_pending_files"
        values: "25+0x60"

    alert_rule_test:
      - eval_time: "14m"
        alertname: "WalSpoolBacklog"
        exp_alerts: []

    name: "WalSpoolBacklog: warning: 25 bekleyen segment — for dolmadan (14 dk) ateşlemez"

  - interval: "1m"
    input_series:
      - series: "yakit_wal_spool_pending_files"
        values: "2+0x60"

    alert_rule_test:
      - eval_time: "20m"
        alertname: "WalSpoolBacklog"
        exp_alerts: []

    name: "WalSpoolBacklog: sessiz: 2 segment"

