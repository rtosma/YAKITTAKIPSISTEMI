# OPS-1107 — Loki (tek ikili, dosya sistemi). Retansiyon 14 gün (compactor). Etiketler kasıtlı olarak AZ (service, container, level);
# traceId/tenantId gibi yüksek kardinaliteli alanlar ETİKET değil "structured metadata" (promtail.yml) — aranabilir ama indeks şişirmez.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h          # 14 gün
  allow_structured_metadata: true
  ingestion_rate_mb: 8
  max_label_names_per_series: 10

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
