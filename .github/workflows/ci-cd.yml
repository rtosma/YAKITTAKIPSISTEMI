name: Yakıttakip Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    # OPS-1104: vX.Y.Z etiketi = ÜRETİM dağıtım talebi (bkz. deploy-production ve docs/ENVIRONMENTS.md).
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]
  pull_request:
    branches: [ main, master ]
  # TEST-1002: k6 yük/stres testi ~90 saniyelik gerçek yük üretir (100
  # eşzamanlı "pompa" @ 1000 istek/sn) — her push/PR'da otomatik çalışmak
  # yerine (CI süresini gereksiz uzatır, ölçüm gürültüsü paylaşımlı runner'a
  # bağlı olur) manuel/elle tetiklemeli tutuluyor.
  workflow_dispatch:

jobs:
  quality-and-tests:
    name: 🧪 Quality Check & Integration Tests
    runs-on: ubuntu-latest
    # OPS-1106/1107/1108 testleri gerçek Postgres/Prometheus/Alertmanager konteynerleri çalıştırır (yedek+PITR ≈ 2 dk, canlı uyarı tatbikatı ≈ 3 dk).
    timeout-minutes: 30
    # ARCH-110: backend/src/config/env.ts artık JWT_SECRET/JWT_REFRESH_SECRET/
    # MQTT_USERNAME/MQTT_PASSWORD'ü HER modül import zincirinde (test_res902.ts
    # ve test_ops1101.ts dahil — logger.ts üzerinden transitif olarak) zorunlu
    # kılıyor. Bu job gerçek bir Postgres/Redis/EMQX'e hiç bağlanmıyor — bu
    # yüzden bu 4 değişken yalnızca config doğrulamasını geçmek için var,
    # gerçek bir kimlik bilgisi değil (auth-integration-test job'ındaki
    # ci_only_* desenle aynı).
    env:
      JWT_SECRET: ci_only_quality_job_access_secret_${{ github.run_id }}
      JWT_REFRESH_SECRET: ci_only_quality_job_refresh_secret_${{ github.run_id }}
      MQTT_USERNAME: ci_only_unused
      MQTT_PASSWORD: ci_only_unused
      HW_SECRET_ESP32_PUMP_01: ci_only_unused
      HW_SECRET_ESP32_TANK_01: ci_only_unused
      HW_SECRET_ESP32_FLOW_ISR: ci_only_unused
      TRANSACTION_HASH_SECRET: ci_only_unused
      HW_SECRET_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      TENANT_EXPORT_ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      NOTIFICATION_CHANNEL_ENCRYPTION_KEY: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # OPS-1104: migration güvenlik denetimi taban şema sürümünü git geçmişinden okur.
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm ci
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Build Backend Bundle
        run: cd backend && npm run build

      - name: Type Check (TypeScript)
        run: npm run lint

      - name: "ARCH-101.3: Tenant Tablolarında RLS Kapsama Kontrolü"
        run: node scripts/check-rls-coverage.mjs

      # OPS-1104 AC: "Migration'lar dağıtımın parçası olarak güvenli uygulanmalıdır." — schema.sql
      # blue/green geçişte eski replikayla birlikte çalışacağından yalnızca EKLEYİCİ (expand) olmalı;
      # yıkıcı ifade `-- MIGRATION-CONTRACT: <gerekçe>` onayı ister (scripts/lib/migrationSafety.mjs).
      - name: "OPS-1104: Migration Güvenliği (expand/contract) Denetimi"
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then BASE="origin/$PR_BASE_REF"; else BASE="$PUSH_BEFORE"; fi
          case "$BASE" in ""|0000000*) BASE="HEAD~1" ;; esac
          node scripts/check-migration-safety.mjs --base "$BASE"

      - name: "OPS-1104: Dağıtım Altyapısı Testleri (migration/duman/changelog/workflow)"
        run: node scripts/test-ops1104.mjs

      # OPS-1106: GERÇEK Postgres konteynerleriyle yedek → WAL gönderimi → geri yükleme (dump + PITR) → tatbikat; şifreleme/kurcalama/retansiyon.
      - name: "OPS-1106: Yedekleme ve Geri Yükleme Testleri (şifreli yedek, PITR, restore tatbikatı)"
        run: node scripts/test-ops1106.mjs

      # OPS-1107: dashboard ↔ metrik kayıt defteri, kardinalite politikası, doküman drift'i, promtool/loki/promtail yapılandırma denetimi, compose güvenliği.
      # (Canlı uçtan uca: node scripts/test-ops1107.mjs --live — çalışan compose yığını gerektirir.)
      - name: "OPS-1107: Gözlemlenebilirlik Yığını Testleri (dashboard, kardinalite, yapılandırma)"
        run: node scripts/test-ops1107.mjs

      # OPS-1108: uyarı kuralları (promtool birim testleri GERÇEK `for` süreleriyle), runbook'lar, Alertmanager yapılandırması (amtool) + CANLI bildirim zinciri
      # tatbikatı (yalıtılmış Prometheus + Alertmanager + sahte alıcı; tüm kritik uyarılar yapay tetiklenir). Yalnızca docker + resmi imajlar gerekir.
      - name: "OPS-1108: Uyarı Kuralları, Runbook'lar ve Yapılandırma Testleri"
        run: node scripts/test-ops1108.mjs
      - name: "OPS-1108: Bildirim Zinciri Tatbikatı (kritik uyarılar yapay tetiklenir)"
        run: node scripts/test-ops1108.mjs --live

      # OPS-1110: drain/grace-period sözleşmesi, rolling sırası, readiness, sürüm kaydı + GERÇEK rollback.sh/migrasyon kapısı senaryoları (sahte docker).
      # (Canlı tatbikat: node scripts/test-ops1110.mjs --live — çalışan compose yığını gerekir; sonuç docs/deploy-drills/ altında.)
      - name: "OPS-1110: Rolling Deploy / Rollback Testleri (drain, readiness, migrasyon kapısı)"
        run: node scripts/test-ops1110.mjs

      - name: "ARCH-101.2: Ham pool.query Kullanımı Denetimi (RLS Bypass Koruması)"
        run: node scripts/check-no-raw-pool-query.mjs

      # COMP-606 (#132): "Loglara TC kimlik no ve telefon yazılmamalıdır" — logger çağrılarında kişisel veri anahtarı taraması + statik sözleşme testleri.
      - name: "COMP-606: Loglarda Kişisel Veri (TCKN/telefon/e-posta) Denetimi"
        run: node scripts/check-no-pii-logging.mjs
      - name: "COMP-606: KVKK Statik Testleri (envanter belgesi, guard fixture, bağlantılar)"
        run: node scripts/test-comp606.mjs

      # RES-907 (#192): Sentry — statik sözleşme + frontend derlemesi (source map üretimi ve orijinal kaynağa geri çözme). Backend davranış testi API job'unda.
      - name: "RES-907: Sentry Statik Sözleşme Testleri"
        run: node scripts/test-res907.mjs
      - name: "RES-907: Frontend Source Map Derleme Testi (okunabilir stack)"
        run: node scripts/test-res907.mjs --build

      # TEST-1007 (#198): kaos paketi sözleşmesi (docker gerektiren kaos koşusu CI dışı: docs/CHAOS_TESTING.md).
      - name: "TEST-1007: Kaos Paketi Sözleşme Testleri"
        run: node scripts/test-test1007.mjs

      # DOC-1206 (#188): saha kurulum prosedürü kodla çelişemez — API uçları, eşikler (±30 sn, %20, TTL, limit), form ↔ belge kriterleri.
      - name: "DOC-1206: Saha Kurulum Belgesi ve Devreye Alma Formu Tutarlılık Testi"
        run: node scripts/test-doc1206.mjs

      # DOC-1207 (#189): operatör el kitabı ↔ cihaz ekran mesajı kataloğu birebir (kataloğdan üretilir), her hata kodunun karşılığı, tek sayfalık özet kart.
      - name: "DOC-1207: El Kitabı ↔ Cihaz Mesaj Kataloğu Uyumu (üretilmiş belge güncel mi?)"
        run: node scripts/generate-operator-manual.mjs --check
      - name: "DOC-1207: Operatör El Kitabı ve Özet Kart Testleri"
        run: node scripts/test-doc1207.mjs

      # DOC-1203 (#40): proje rehberinin üretilen bölümleri (şema, rol matrisi, uçlar, rapor kataloğu) koddan güncel mi + kurulum betiği gerçekten çalışıyor mu.
      - name: "DOC-1203: Proje Rehberi Güncel mi? (koddan üretilen bölümler)"
        run: node scripts/generate-project-guide.mjs --check
      - name: "DOC-1203: Proje Rehberi Sözleşme Testleri (kurulum, modül haritası, diyagramlar, roller)"
        run: node scripts/test-doc1203.mjs

      # TEST-1004 (#196): tarayıcı E2E sözleşmesi — yalnızca data-testid seçici, determinizm kuralları, testid'lerin arayüzde var olması, kanıt yapılandırması, CI/nightly.
      - name: "TEST-1004: Playwright E2E Sözleşme Testleri"
        run: node scripts/test-test1004.mjs

      # TEST-1001 (#193): E2E altyapısının sözleşmesi — orkestratör bütçesi, izolasyon kuralı (tohum tenant'ına dokunma), CI işi ve deploy geçidi.
      - name: "TEST-1001: E2E Altyapı Sözleşmesi Testleri"
        run: node scripts/test-test1001.mjs

      # DOC-1204 (#41): sunum rehberi — 12-15 slayt + konuşma metni, ≥ 8 SSS, 60 sn özet, teknik terim/uydurma oran yok, fiyat/menü/eşikler kodla aynı.
      - name: "DOC-1204: Sunum Rehberi Testleri"
        run: node scripts/test-doc1204.mjs

      # DOC-1205 (#42): sözlük — ≥ 30 terim, TR–EN karşılıklar, "projede nerede" yolları gerçek, sayısal iddialar kodla aynı, rehberde ilk geçişte bağlı.
      - name: "DOC-1205: Terim Sözlüğü Testleri"
        run: node scripts/test-doc1205.mjs

      - name: "ARCH-110: Ham process.env Kullanımı Denetimi (Tipli Config Zorunluluğu)"
        run: node scripts/check-no-direct-process-env.mjs

      - name: "ARCH-110: .env.example ↔ Config Şeması Senkron Kontrolü"
        run: node scripts/check-env-example-sync.mjs

      # TEST_PLAN.md §6 — geçersiz bir workflow dosyası CI'ı "kırmızı" değil
      # "yok" yapar (GitHub hiçbir job çalıştırmaz, hiçbir uyarı görünmez).
      # Bu gerçekten yaşandı: 151881b ile giren tırnaksız "OPS-1105:" başlığı
      # dosyayı geçersiz YAML yaptı. Bir daha sessizce olmasın diye kilitli.
      - name: "GÜVENLİK: Workflow YAML Geçerlilik Denetimi"
        run: node scripts/check-workflow-yaml.mjs

      # TEST_PLAN.md §0.2 — YAML sözdizimi geçerli olup ANLAMSAL olarak geçersiz
      # bir workflow da hiç çalışmaz (gerçek olay: job-level if içinde secrets).
      # actionlint GitHub Actions ifadelerini, bağlam kullanımını ve run
      # bloklarını (shellcheck) denetler. İmaj sürümü sabitlendi (latest değil).
      - name: "GÜVENLİK: Workflow Anlamsal Denetimi (actionlint)"
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

      # TEST_PLAN.md §3.4 — frontend'de ESLint yok; XSS/kod-enjeksiyon sink'leri
      # ve xlsx'in (bilinen HIGH zafiyetli) parse yolu mekanik olarak yasak.
      - name: "GÜVENLİK: Frontend XSS / Tehlikeli Desen Denetimi"
        run: node scripts/check-frontend-security.mjs

      # TEST_PLAN.md §2.2 — Trivy YALNIZCA imaj/OS paketlerini tarıyor;
      # node_modules içindeki JS bağımlılık zafiyetleri bu adımla kapsanır.
      # GHSA bazlı allowlist: bilinmeyen HER yeni advisory build'i kırar.
      - name: "GÜVENLİK: Bağımlılık Zafiyet Denetimi (npm audit, GHSA allowlist)"
        run: node scripts/check-dependency-audit.mjs

      # TEST_PLAN.md §5.1 — CSP + diğer güvenlik başlıkları. Statik denetim:
      # CI'da nginx YOK (backend çıplak çalışıyor), bu yüzden canlı curl
      # testi burada çalışamaz; yapılandırmanın kendisi denetleniyor.
      - name: "GÜVENLİK: Güvenlik Yanıt Başlıkları (CSP) Denetimi"
        run: node scripts/check-security-headers.mjs

      # TEST_PLAN.md §0.3 — login rate-limit (10/15dk, IP bazlı) test paketi
      # içinde tükenince SONRAKİ testler 429 alıp yanlışlıkla kırılıyor.
      # Bu guard, giriş yapan her testin temizlik yapmasını zorunlu kılar.
      - name: "TEST HİJYENİ: Login Rate-Limit Temizliği Denetimi"
        run: node scripts/check-test-rate-limit-hygiene.mjs

      # TEST_PLAN.md §3 — frontend'in ilk otomatik testleri. Kapsam bilinçli
      # olarak dar: oturum zinciri (401 → sessiz token yenileme → otomatik
      # çıkış). Backend'den farklı olarak bunlar gerçek servis GEREKTİRMEZ
      # (jsdom + mock fetch), bu yüzden hızlı `quality-and-tests` işinde.
      - name: "TEST_PLAN §3 + TEST-1006: Birim Testleri + Coverage Eşiği (backend + frontend, vitest)"
        # TEST-1006 (#47): `npm test` kökten iki paketin birim testlerini koşturur; `test:coverage` ayrıca v8 coverage ölçer ve EŞİK ALTINDA
        # sıfır olmayan çıkış koduyla build'i KIRAR (backend hesap motorları %90, kapsamdaki tüm dosyalar %70; frontend genel %20 taban, mantık
        # modülleri %70). Bu testler DB/Redis/ağ gerektirmez → hızlı quality-and-tests işinde.
        run: npm run test:coverage

      - name: "TEST-1006: Birim Testleri Tip Denetimi (backend/unit + test-support)"
        run: npm run test:unit:typecheck

      - name: "TEST-1006: Coverage Eşiği Davranış Testi + Altyapı Sözleşmesi"
        run: node scripts/test-test1006.mjs

      - name: "TEST-1006: Coverage Özeti (iş özeti + artifact)"
        if: always()
        run: |
          {
            echo "### Birim test coverage (TEST-1006)"
            for pkg in backend frontend; do
              f="$pkg/coverage/coverage-summary.json"
              [ -f "$f" ] && node -e "const t=require('./$f').total;console.log('- **$pkg**: satır %'+t.lines.pct+' · dal %'+t.branches.pct+' · fonksiyon %'+t.functions.pct+' · ifade %'+t.statements.pct)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "TEST-1006: Coverage Raporları (lcov)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: |
            backend/coverage/lcov.info
            frontend/coverage/lcov.info
          if-no-files-found: ignore

      - name: Run RES-902 Exception Filter & Logging Tests
        run: cd backend && npx tsx test/test_res902.ts

      - name: Run OPS-1101 Graceful Shutdown Tests
        run: cd backend && npx tsx test/test_ops1101.ts
        env:
          POSTGRES_HOST: __CI_SKIP__
#__CI_SKIP__ değişkeni SIGTERM testinde sunucu başlatılırken gerçek bir PostgreSQL'e bağlanma denemesini önlemek için


  auth-integration-test:
    name: 🔐 AUTH-201 Integration Test (Login, Refresh Rotation, RBAC)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # test_auth201.ts makes real HTTP calls against a running server backed by
    # a real PostgreSQL + Redis — the other two test files never actually
    # exercised login/refresh-rotation/RBAC end-to-end. Previously not run in
    # CI at all; it would have failed on the pompa-op-01 PUMP_OPERATOR fixture
    # user, which is now part of seed_mock_data.sql.
    # Job seviyesinde (adım seviyesinde değil): testHardwareAuth.ts (ayrı bir
    # adımda çalışır) sunucuyla AYNI HW_SECRET_ESP32_PUMP_01 değerini
    # görmeli, aksi halde hesapladığı HMAC imzası sunucununkiyle eşleşmez.
    env:
      HW_SECRET_ESP32_PUMP_01: ci_only_hw_secret_pump_${{ github.run_id }}
      HW_SECRET_ESP32_TANK_01: ci_only_hw_secret_tank_${{ github.run_id }}
      HW_SECRET_ESP32_FLOW_ISR: ci_only_hw_secret_flow_${{ github.run_id }}
      TRANSACTION_HASH_SECRET: ci_only_tx_hash_secret_${{ github.run_id }}
      # AUTH-202.3: tam 64 hex karakter olmak ZORUNDA (AES-256-GCM anahtarı,
      # bkz. config/env.ts'in regex doğrulaması) — diğer ci_only_* değerleri
      # gibi rastgele bir metin OLAMAZ.
      HW_SECRET_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      TENANT_EXPORT_ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      NOTIFICATION_CHANNEL_ENCRYPTION_KEY: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      # IOT-302.1: sunucu ve test_iot302_1 AYNI token'ı görmeli (test webhook'a
      # bu token'la POST atıyor). Job seviyesinde tanımlı → hem "Start Backend
      # Server" hem test adımları görür.
      LORAWAN_WEBHOOK_TOKEN: ci_only_lorawan_webhook_token_${{ github.run_id }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yakittakip_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Apply Database Schema & Seed Data
        run: |
          # TEST_PLAN.md §4 — ON_ERROR_STOP=1 ŞART: olmadan psql bozuk bir SQL
          # ifadesinde bile exit 0 döner (canlı doğrulandı). Yani schema.sql'deki
          # bir CREATE POLICY/REVOKE hata verse CI YEŞİL kalırdı; statik RLS
          # guard'ı (check-rls-coverage.mjs) dosya METNİNE baktığı için bunu da
          # göremezdi — politika dosyada var, veritabanında yok.
          PGPASSWORD=postgres psql -h localhost -U postgres -d yakittakip_db -v ON_ERROR_STOP=1 -f backend/src/db/schema.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d yakittakip_db -v ON_ERROR_STOP=1 -f backend/src/db/seed_mock_data.sql

      # TEST_PLAN.md §4 — projede migration aracı YOK: schema.sql yalnızca boş bir
      # veritabanında (docker-entrypoint-initdb.d) uygulanıyor. Mevcut bir DB'ye
      # (production) bir şema/güvenlik düzeltmesi ulaştırmanın tek güvenli yolu
      # schema.sql'i YENİDEN çalıştırmak — bu da ancak dosya idempotent kaldıkça
      # güvenli. Bu adım onu kilitliyor: dolu DB'ye ikinci kez uygulanamayan bir
      # ifade (IF NOT EXISTS unutulmuş CREATE, korumasız CREATE POLICY...) CI'ı kırar.
      - name: "TEST_PLAN §4: schema.sql + seed İdempotentlik (ikinci uygulama)"
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d yakittakip_db -v ON_ERROR_STOP=1 -q -f backend/src/db/schema.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d yakittakip_db -v ON_ERROR_STOP=1 -q -f backend/src/db/seed_mock_data.sql
          echo "schema.sql ve seed dolu bir veritabanına hatasız yeniden uygulandı."

      - name: Start Backend Server (background)
        run: |
          nohup npx tsx src/bootstrap.ts > /tmp/backend-ci.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/v1/health > /dev/null && echo "Backend healthy after ${i}s" && exit 0
            sleep 1
          done
          echo "Backend did not become healthy in time — server log follows:"
          cat /tmp/backend-ci.log
          exit 1
        working-directory: backend
        env:
          PORT: 5000
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yakittakip_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          # CI-only throwaway secrets — never reused outside this ephemeral job run.
          JWT_SECRET: ci_only_access_secret_${{ github.run_id }}_${{ github.run_attempt }}
          JWT_REFRESH_SECRET: ci_only_refresh_secret_${{ github.run_id }}_${{ github.run_attempt }}
          MQTT_URL: __CI_SKIP__
          # ARCH-110: MQTT_URL=__CI_SKIP__ yalnızca mqttService.connect()'in
          # ÇAĞRILMASINI atlar (bkz. index.ts) — config/env.ts şeması
          # MQTT_USERNAME/MQTT_PASSWORD'ü bundan bağımsız, her zaman zorunlu
          # kılıyor; bu job gerçek bir EMQX'e hiç bağlanmadığından bunlar da
          # yalnızca doğrulamayı geçmek için birer placeholder.
          MQTT_USERNAME: ci_only_unused
          MQTT_PASSWORD: ci_only_unused

      - name: Run AUTH-201 Integration Tests
        run: cd backend && npx tsx test/test_auth201.ts

      - name: Run AUTH-202.2 Hardware HMAC + Replay/Nonce Tests
        run: cd backend && npx tsx test/testHardwareAuth.ts

      - name: Run AUTH-209 Account Lockout Tests
        run: cd backend && npx tsx test/test_auth209.ts

      - name: Run AUTH-204 Site Provisioning + Forced Password Change Tests
        run: cd backend && npx tsx test/test_auth204.ts

      - name: Run AUTH-203 Append-Only Audit Trail Tests
        run: cd backend && npx tsx test/test_auth203.ts

      - name: Run AUTH-201.4 RBAC Matrix + Site-Scoping Tests
        run: cd backend && npx tsx test/test_auth201_4_rbac_matrix.ts

      - name: Run TEST-1003 Tenant Isolation Leak Tests
        run: cd backend && npx tsx test/test_195_tenant_isolation.ts

      # TEST_PLAN.md §0.1 — route/test kapsama taraması sonucu hiç test
      # edilmediği bulunan 2 uç (offline-ratio-alerts RBAC + tenant izolasyonu,
      # tenant-info kimlik doğrulaması). Bu adım CI'daki çıplak backend'e
      # (port 5000) bağlanır — nginx YOK, bu yüzden API_URL override YOK.
