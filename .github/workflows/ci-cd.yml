      - name: Run COMP-601 UBL DespatchAdvice (e-İrsaliye) Tests
        run: cd backend && npx tsx test/test_comp601_despatch_advice.ts

      - name: Run FUEL-403 Strapping Table + Volume Math Tests
        run: cd backend && npx tsx test/test_fuel403_strapping_table.ts

      - name: Run AUTH-206 Password Reset Flow Tests
        run: cd backend && npx tsx test/test_auth206_password_reset.ts

      - name: Run AUTH-210 RFID Card Blacklist Tests
        run: cd backend && npx tsx test/test_auth210_rfid_blacklist.ts

      - name: Run RES-906 Health/Readiness Tests
        run: cd backend && npx tsx test/test_res906_health_readiness.ts

      - name: Run FUEL-402.1 Fuel Quota + Periodic Reset Tests
        run: cd backend && npx tsx test/test_fuel402_1_quota.ts

      - name: Run FUEL-408 Tank Intake Receipt + Stock Increase Tests
        run: cd backend && npx tsx test/test_fuel408_tank_intake.ts

      - name: Run FUEL-409 Theoretical vs Physical Stock Reconciliation Tests
