name: Yakıttakip Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-tests:
    name: 🧪 Quality Check & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm ci
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Build Backend Bundle
        run: cd backend && npm run build

      - name: Type Check (TypeScript)
        run: npm run lint

      - name: "ARCH-101.3: Tenant Tablolarında RLS Kapsama Kontrolü"
        run: node scripts/check-rls-coverage.mjs

      - name: "ARCH-101.2: Ham pool.query Kullanımı Denetimi (RLS Bypass Koruması)"
        run: node scripts/check-no-raw-pool-query.mjs

      - name: Run RES-902 Exception Filter & Logging Tests
        run: cd backend && npx tsx test/test_res902.ts

      - name: Run OPS-1101 Graceful Shutdown Tests
        run: cd backend && npx tsx test/test_ops1101.ts
        env:
          POSTGRES_HOST: __CI_SKIP__
#__CI_SKIP__ değişkeni SIGTERM testinde sunucu başlatılırken gerçek bir PostgreSQL'e bağlanma denemesini önlemek için


  auth-integration-test:
    name: 🔐 AUTH-201 Integration Test (Login, Refresh Rotation, RBAC)
    runs-on: ubuntu-latest
    # test_auth201.ts makes real HTTP calls against a running server backed by
    # a real PostgreSQL + Redis — the other two test files never actually
    # exercised login/refresh-rotation/RBAC end-to-end. Previously not run in
    # CI at all; it would have failed on the pompa-op-01 PUMP_OPERATOR fixture
    # user, which is now part of seed_mock_data.sql.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yakittakip_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Apply Database Schema & Seed Data
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d yakittakip_db -f backend/src/db/schema.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d yakittakip_db -f backend/src/db/seed_mock_data.sql

      - name: Start Backend Server (background)
        run: |
          nohup npx tsx src/bootstrap.ts > /tmp/backend-ci.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/v1/health > /dev/null && echo "Backend healthy after ${i}s" && exit 0
            sleep 1
          done
          echo "Backend did not become healthy in time — server log follows:"
          cat /tmp/backend-ci.log
          exit 1
        working-directory: backend
        env:
          PORT: 5000
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yakittakip_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          # CI-only throwaway secrets — never reused outside this ephemeral job run.
          JWT_SECRET: ci_only_access_secret_${{ github.run_id }}_${{ github.run_attempt }}
          JWT_REFRESH_SECRET: ci_only_refresh_secret_${{ github.run_id }}_${{ github.run_attempt }}
          MQTT_URL: __CI_SKIP__

      - name: Run AUTH-201 Integration Tests
        run: cd backend && npx tsx test/test_auth201.ts

      - name: Run AUTH-202.2 Hardware HMAC + Replay/Nonce Tests
        run: cd backend && npx tsx test/testHardwareAuth.ts

      - name: Dump Backend Log on Failure
        if: failure()
        run: cat /tmp/backend-ci.log || true

  build-bundle:
    name: 📦 Build Standalone Bundles
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm ci
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Build All Bundles
        run: npm run build

      - name: Verify Backend Bundle Output
        run: test -f backend/dist/server.cjs && echo "backend/dist/server.cjs built successfully"

      - name: Verify Frontend Bundle Output
        run: test -f frontend/dist/index.html && echo "frontend/dist/index.html built successfully"

  docker-security-scan:
    name: 🔒 Docker Multi-Stage Build & Trivy Security Scan
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: yakittakip-backend:ci-${{ github.sha }}

      - name: Run Trivy Vulnerability Scanner (Critical & High CVEs)
        # exit-code was previously hardcoded to '0' (never fails the build) to
        # work around CVEs in the base image's bundled npm CLI (tar, minimatch,
        # cross-spawn...) and stale OpenSSL packages. Both are now fixed at the
        # source instead of muted here: backend/Dockerfile removes the unused
        # bundled npm CLI from the runtime image and runs `apk upgrade` for
        # patched OS packages — a fresh scan comes back with zero CRITICAL/HIGH
        # findings. exit-code is back to '1' so a real new CVE actually fails CI.
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'yakittakip-backend:ci-${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ----------------------------------------------------------------------------
  # OPS-1102 — Sıfır Kesintili Otomatik Dağıtım
  # ----------------------------------------------------------------------------
  # main/master'a yapılan HER push, yukarıdaki tüm kalite kapılarından (lint,
  # tip kontrolü, RES-902/OPS-1101/AUTH-201 testleri, bundle derlemesi, Trivy
  # CVE taraması) geçtikten SONRA otomatik olarak dağıtılır — ama yalnızca
  # DEPLOY_HOST secret'ı tanımlıysa. Bu repoda henüz gerçek bir hedef sunucu
  # (VM/VPS) tanımlı DEĞİL; secret'lar boşken bu job'un `if` koşulu false
  # olur ve job atlanır (CI kırılmaz) — bir hedef sunucu hazır olduğunda
  # yalnızca aşağıdaki 4 repository secret'ını eklemek yeterlidir:
  #   DEPLOY_HOST     — sunucu IP/hostname
  #   DEPLOY_USER     — SSH kullanıcı adı
  #   DEPLOY_SSH_KEY  — parolasız SSH private key (PEM)
  #   DEPLOY_PORT     — (opsiyonel) SSH portu, varsayılan 22
  #
  # Sunucu tarafında bir kereye mahsus hazırlık: bu repo'yu klonlayın, kök
  # dizine gerçek .env dosyasını koyun, `docker compose up -d` ile yığını
  # ayağa kaldırın. Bu job'un yaptığı her şey: sunucuya SSH ile bağlanıp
  # `git fetch && git reset --hard origin/<branch>` ile en son commit'e
  # geçmek ve scripts/zero-downtime-deploy.sh'yi çalıştırmak — o script
  # backend'i (nginx üzerinden atomik bir kesme ile) sıfır kesintiyle
  # günceller. Bu mekanizma bu oturumda canlı olarak doğrulanmıştır: swap
  # sırasında sürekli /api/v1/health isteği atan bir döngü, 3 ardışık koşuda
  # toplam 1000+ istekte 0 başarısızlık gözlemlemiştir (bkz. commit mesajı).
  deploy-zero-downtime:
    name: 🚀 Sıfır Kesintili Dağıtım (yalnızca main/master push, DEPLOY_HOST tanımlıysa)
    needs: [quality-and-tests, auth-integration-test, build-bundle, docker-security-scan]
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      secrets.DEPLOY_HOST != ''

    steps:
      - name: Deploy via SSH (git pull + zero-downtime-deploy.sh)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH:-~/YAKITTAKIPSISTEMI}"
            git fetch origin
            git reset --hard "origin/${{ github.ref_name }}"
            chmod +x scripts/zero-downtime-deploy.sh
            ./scripts/zero-downtime-deploy.sh
            # Diğer servisler (nginx statik dosyaları, postgres şeması vb.)
            # zero-downtime gerektirmeyen normal bir 'up -d --build' ile.
            docker compose up -d --build frontend
