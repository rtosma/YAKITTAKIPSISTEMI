  # eşzamanlı koşar → toplam CI süresine eklenmez). timeout-minutes AC'nin "10 dakikanın altında" bütçesidir; orkestratör ayrıca --budget-sec ile
  # kendi süresini denetler ve aşarsa BAŞARISIZ olur. Testcontainers yerine docker CLI orkestratörü (bkz. scripts/e2e/run-e2e.mjs başlığı: KAPSAM UYARLAMASI).
  e2e-fuel-cycle:
    name: 🔄 TEST-1001 E2E İkmal Döngüsü (Postgres + Redis + EMQX, paralel, < 10 dk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run E2E suite (izole konteynerler, paralel dosyalar, süre bütçesi)
        run: node scripts/e2e/run-e2e.mjs --budget-sec 540

  # TEST-1004 (#196): 3 panelin (geliştirici / yönetici / şantiye) + kimlik akışlarının GERÇEK tarayıcıda (headless Chromium) uçtan uca doğrulanması.
  # Orkestratör aynı izole yığını (Postgres+Redis+EMQX+backend) kurar, frontend'i üretim derlemesiyle nginx'te sunar, Playwright'ı koşturur.
  # HATA KANITI (AC): başarısız testin ekran görüntüsü + VİDEO + trace `frontend/test-results` altında; `if: always()` ile artifact olarak yüklenir.
  # Merge öncesi (push/PR → main) burada, nightly + tekrarlı flake avı .github/workflows/e2e-nightly.yml'de (süre yönetimi).
  e2e-browser:
    name: 🌐 TEST-1004 Playwright — 3 Panel Kritik Akışları (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies (Playwright)
        run: cd frontend && npm ci

      - name: Install Chromium (Playwright)
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run Playwright critical flows (izole yığın, süre bütçesi)
        run: node scripts/e2e/run-e2e.mjs --browser --budget-sec 900

      - name: Upload failure evidence (screenshot + video + trace + HTML report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  secret-scan:
    # DİKKAT: bu satırdaki iki nokta üst üste ("OPS-1105:") YAML'da bir mapping
    # ayırıcısı olarak yorumlanır — tırnaksız bırakılırsa TÜM workflow dosyası
    # geçersiz hale gelir ve GitHub Actions hiçbir job'ı çalıştırmaz (sessiz
    # başarısızlık). Bkz. scripts/check-workflow-yaml.mjs.
    name: "🔑 OPS-1105: Gitleaks Secret Taraması"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Diğer job'lardan bağımsız — build/test beklemeden hemen çalışabilir.
    # AC: "Repoda hiçbir gerçek secret bulunmamalı ve tarama CI'da çalışmalıdır."
    # Şu an checkout edilen ağaç taranır (git geçmişi değil) — .gitleaks.toml'a
    # bakın: bu, bu commit'te kaynak kodundan env değişkenlerine taşınan
    # (bkz. hardwareAuthMiddleware.ts) donanım cihaz sırlarını YAKALADIĞI için
    # eklendi. Geçmiş commit'lerdeki eski değerler git log'da hâlâ görülebilir
    # — tam geçmiş temizliği (BFG/filter-repo + force-push + rotasyon) ayrı,
    # kasıtlı bir onay gerektiren bir iş.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # TEST_PLAN.md §5.1 — ikili dosya checksum doğrulaması OLMADAN indiriliyordu:
      # güvenlik tarayıcısının kendisi supply-chain saldırısına açıktı. SHA-256,
      # gitleaks'in resmi v8.30.1 checksums dosyasıyla çapraz doğrulandı.
      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # TEST_PLAN.md §5.1 — .env'in commit'lenmesi en yaygın gerçek sızıntı
      # senaryosu; gitleaks bir kurala uymayan bir değeri kaçırabilir, bu kontrol
      # ise DOSYANIN KENDİSİNİN takip edilmesini yasaklar (.env.example serbest).
      - name: Takip Edilen .env Dosyası Yasağı
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.[^/]*)?$' | grep -v '\.env\.example$'; then
            echo "HATA: yukarıdaki .env dosyası(ları) git tarafından takip ediliyor — gerçek sırlar içerebilir." >&2
            exit 1
          fi
          echo "Takip edilen .env dosyası yok."

      - name: Scan checked-out tree for secrets
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --verbose

  build-bundle:
    name: 📦 Build Standalone Bundles
    needs: quality-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm ci
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Build All Bundles
        run: npm run build

      - name: Verify Backend Bundle Output
        run: test -f backend/dist/server.cjs && echo "backend/dist/server.cjs built successfully"

      - name: Verify Frontend Bundle Output
        run: test -f frontend/dist/index.html && echo "frontend/dist/index.html built successfully"

      # TEST_PLAN.md §3.4 — tarayıcıya giden GERÇEK çıktıda kimlik bilgisi /
      # sır / kaynak haritası sızıntısı (kaynak guard'ı bunları göremez: mock
      # verisi ve VITE_ değişkenleri ancak build sonrası bundle'da belirir).
      - name: Frontend Bundle Leak Guard
        run: node scripts/check-frontend-bundle.mjs frontend/dist

  docker-security-scan:
    name: 🔒 Docker Multi-Stage Build & Trivy Security Scan
    needs: quality-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Local Backend Docker Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: yakittakip-backend:ci-${{ github.sha }}

      - name: "OPS-1101: Üretim İmajı Boyut Kontrolü"
        # AC'nin kendi hedefi <150MB — ama node:20-alpine BAZ imajının
        # KENDİSİ (yarn + full alpine build toolchain kalıntıları) zaten
        # ~194MB, bu hedefi tek başına bile karşılamıyor. Bu yüzden 150MB
        # yerine, imajın gerçek katman analiziyle (bkz. Dockerfile'daki
        # OPS-1101 yorumları — chown copy-up + apk add/del ayrı katman
        # sorunları düzeltildikten SONRA) ulaşılabilir olduğu doğrulanmış
        # 450MB'lık bir tavan kullanılıyor; bunun ÜZERİNE çıkan bir
        # regresyon (örn. yanlışlıkla geri gelen bir devDependency) build'i
        # kırar.
        run: |
          # `docker image inspect .Size` ile `docker images` SIZE kolonu bazı
          # Docker sürümlerinde (containerd image store) farklı sayılar
          # verebiliyor — `docker images`'in insan-okunur çıktısı burada daha
          # güvenilir, bu yüzden onu ayrıştırıyoruz.
          SIZE_STR=$(docker images yakittakip-backend:ci-${{ github.sha }} --format "{{.Size}}")
          echo "Üretim imajı boyutu: ${SIZE_STR}"
          # GB'a gelmiş olması zaten başlı başına anormal bir regresyon
          # göstergesidir (hedef 450MB) — bu yüzden GB durumunda ayrıca
          # kesirli çarpım yapmaya çalışmadan doğrudan eşiği aştığını
          # işaretliyoruz (999999).
          SIZE_MB_INT=$(echo "$SIZE_STR" | awk '
            /GB/ { print 999999; exit }
            /MB/ { gsub("MB",""); printf "%d", $1; exit }
            /kB/ { print 0; exit }
            { print 999999 }
          ')
          echo "Hesaplanan: ${SIZE_MB_INT}MB"
          if [ "$SIZE_MB_INT" -gt 450 ]; then
            echo "HATA: imaj ${SIZE_MB_INT}MB — 450MB tavanını aşıyor (bkz. Dockerfile'daki OPS-1101 notu)."
            exit 1
          fi

      - name: Run Trivy Vulnerability Scanner (Critical & High CVEs)
        # exit-code was previously hardcoded to '0' (never fails the build) to
        # work around CVEs in the base image's bundled npm CLI (tar, minimatch,
        # cross-spawn...) and stale OpenSSL packages. Both are now fixed at the
        # source instead of muted here: backend/Dockerfile removes the unused
        # bundled npm CLI from the runtime image and runs `apk upgrade` for
        # patched OS packages — a fresh scan comes back with zero CRITICAL/HIGH
        # findings. exit-code is back to '1' so a real new CVE actually fails CI.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (önceden kayan @master)
        with:
          image-ref: 'yakittakip-backend:ci-${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Frontend (nginx) imajı internete bakan tek bileşen olduğu hâlde HİÇ
      # taranmıyordu; yerel Trivy tatbikatında düzeltmesi yayımlanmış 36
      # HIGH/CRITICAL bulundu (OpenSSL CRITICAL dahil). Aynı eşik, aynı action.
      - name: Build Frontend Image for Scanning
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: yakittakip-frontend:ci-${{ github.sha }}

      - name: Run Trivy Vulnerability Scanner on Frontend Image (Critical & High CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'yakittakip-frontend:ci-${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ----------------------------------------------------------------------------
  # OPS-1102 — Sıfır Kesintili Otomatik Dağıtım
  # ----------------------------------------------------------------------------
  # OPS-1104 — ÜÇ ORTAM, İKİ DAĞITIM YOLU (ayrıntı: docs/ENVIRONMENTS.md)
  #
  #   development : geliştiricinin makinesi (docker compose) — bu workflow dokunmaz.
  #   staging     : main/master'a HER push → tüm kalite kapıları geçince OTOMATİK dağıtım + duman testi.
  #   production  : vX.Y.Z ETİKETİ → aynı kapılar + GitHub `production` environment'ının ONAYI
  #                 (Required reviewers) → dağıtım → duman testi → başarısızsa önceki etikete otomatik geri alma.
  #
  # Ortam farkları GitHub Environments'ta tutulur: aynı isimli secret'lar (DEPLOY_HOST, DEPLOY_USER,
  # DEPLOY_SSH_KEY, DEPLOY_PORT, SMOKE_USERNAME, SMOKE_PASSWORD) ve değişkenler (STAGING_URL / PRODUCTION_URL)
  # her environment'ta FARKLI değerlerle tanımlanır — staging sırları üretim sunucusuna erişemez
  # (erişim kısıtı). DEPLOY_HOST tanımsızsa dağıtım adımı atlanır (CI kırılmaz; hedef sunucu hazır olunca
  # yalnızca secret'lar eklenir). Sunucu hazırlığı: repo klonu + kök dizinde gerçek .env + `docker compose up -d`.
  # Şema dağıtımın PARÇASIDIR: scripts/zero-downtime-deploy.sh adım 2b schema.sql'i tek transaction'da
  # uygular (hata → hiçbir konteynere dokunulmaz).
  # ----------------------------------------------------------------------------
  deploy-staging:
    name: 🚀 Staging Dağıtımı (otomatik, main/master push) + duman testi
    needs: [quality-and-tests, auth-integration-test, e2e-fuel-cycle, e2e-browser, build-bundle, docker-security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TEST_PLAN.md §0.2 — `secrets` bağlamı job seviyesindeki `if:` içinde KULLANILAMAZ (yalnızca github,
    # inputs, needs, vars); secret job env'ine alınır, koşul ADIM seviyesinde env ile kontrol edilir.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      SMOKE_BASE_URL: ${{ vars.STAGING_URL != '' && format('{0}/api/v1', vars.STAGING_URL) || '' }}
      SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
    steps:
      - name: Checkout Repository (duman testi scripti için)
        uses: actions/checkout@v4

      - name: Deploy via SSH (git pull + zero-downtime-deploy.sh)
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH:-~/YAKITTAKIPSISTEMI}"
            git fetch origin
            git reset --hard "origin/${{ github.ref_name }}"
            chmod +x scripts/zero-downtime-deploy.sh
            ./scripts/zero-downtime-deploy.sh
            # Frontend (nginx statik dosyaları) zero-downtime gerektirmediği için normal bir 'up -d --build' ile.
            # Şema, zero-downtime-deploy.sh adım 2b'de zaten uygulandı (idempotent, tek transaction).
            APP_VERSION="$(git describe --tags --always --dirty=-dirty | tr -c 'A-Za-z0-9._+-' '-' | cut -c1-64)" docker compose up -d --build frontend

      # OPS-1104 AC: "Dağıtım sonrası duman testleri otomatik çalışmalıdır." Başarısız duman testi
      # dağıtım adımını başarısız yapar (job kırmızı) — bozuk staging fark edilmeden kalmaz.
      - name: Smoke Test (dağıtım sonrası)
        if: env.DEPLOY_HOST != '' && env.SMOKE_BASE_URL != ''
        env:
          SMOKE_CHECK_FRONTEND: '1'
          SMOKE_CHECK_HEADERS: '1'
        run: node scripts/smoke-test.mjs

  deploy-production:
    name: 🏭 Üretim Dağıtımı (vX.Y.Z etiketi + ONAY) + duman testi + otomatik geri alma
    needs: [quality-and-tests, auth-integration-test, e2e-fuel-cycle, e2e-browser, build-bundle, docker-security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # OPS-1104 AC: "Staging otomatik, üretim onaylı dağıtılmalıdır." Bu environment'ta Settings →
    # Environments → production → "Required reviewers" TANIMLI olmalıdır; job onay gelene kadar başlamaz.
    # Onaylayan, aşağıdaki "Onay kaydı" adımıyla iş özetine yazılır ve doğrulanır (yoksa dağıtım DURUR).
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: write   # GitHub Release (değişiklik günlüğü) oluşturmak için
      actions: read     # onay kayıtlarını okumak için
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      SMOKE_BASE_URL: ${{ vars.PRODUCTION_URL != '' && format('{0}/api/v1', vars.PRODUCTION_URL) || '' }}
      SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout Repository (tam geçmiş — etiket/changelog için)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Yalnızca main geçmişindeki bir commit üretime çıkabilir (dal/PR commit'i etiketlenip yanlışlıkla dağıtılmasın).
      - name: Etiket main geçmişinde mi?
        run: |
          git fetch origin main --quiet || git fetch origin master --quiet
          MAIN_REF=$(git rev-parse --verify --quiet origin/main || git rev-parse --verify origin/master)
          git merge-base --is-ancestor "$GITHUB_SHA" "$MAIN_REF" || { echo "::error::$TAG main/master geçmişinde değil — üretime yalnızca ana daldan sürüm çıkarılır."; exit 1; }

      # Ticket Teknik Notu: "Üretim dağıtımı onay gerektirmeli ve kim onayladı kaydedilmelidir."
      # Onay kaydı GitHub'ın run-approvals kaydından okunur (değiştirilemez, GitHub tarafında tutulur) ve
      # iş özetine + GitHub Release notuna yazılır. Onay yoksa (environment'ta reviewer tanımsız) dağıtım DURUR.
      - name: Onay kaydı (kim onayladı)
        id: approvals
        run: |
          APPROVERS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" --jq '[.[] | select(.state=="approved") | .user.login] | unique | join(", ")')
          if [ -z "$APPROVERS" ]; then
            echo "::error::Bu çalıştırma için onay kaydı yok. Settings → Environments → production → Required reviewers tanımlayın (OPS-1104)."
            exit 1
          fi
          echo "approvers=$APPROVERS" >> "$GITHUB_OUTPUT"
          {
            echo "### Üretim dağıtımı — onay kaydı"
            echo "- Sürüm: \`$TAG\` (\`${GITHUB_SHA::12}\`)"
            echo "- Etiketi atan / dağıtımı tetikleyen: @${GITHUB_ACTOR}"
            echo "- Onaylayan(lar): $APPROVERS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy via SSH (etiketli commit + zero-downtime-deploy.sh)
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH:-~/YAKITTAKIPSISTEMI}"
            git fetch origin --tags
            git reset --hard "${{ github.sha }}"
            chmod +x scripts/zero-downtime-deploy.sh
            ./scripts/zero-downtime-deploy.sh
            APP_VERSION="$(git describe --tags --always --dirty=-dirty | tr -c 'A-Za-z0-9._+-' '-' | cut -c1-64)" docker compose up -d --build frontend

      - name: Smoke Test (dağıtım sonrası)
        id: smoke
        if: env.DEPLOY_HOST != '' && env.SMOKE_BASE_URL != ''
        env:
          SMOKE_CHECK_FRONTEND: '1'
          SMOKE_CHECK_HEADERS: '1'
        run: node scripts/smoke-test.mjs

      # Duman testi başarısızsa bir önceki etikete GERİ AL. Şema yalnızca EKLEYİCİ (expand) olduğu için
      # (check-migration-safety) eski kod yeni şemayla çalışır — geri alma veri kaybettirmez. Job yine KIRMIZI biter.
      - name: Otomatik geri alma (duman testi başarısızsa)
        if: failure() && steps.smoke.conclusion == 'failure'
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${TAG}^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            echo "::error::Duman testi başarısız ve geri alınacak önceki sürüm etiketi yok — MANUEL müdahale gerekli."
            exit 0
          fi
          echo "PREV_TAG=$PREV" >> "$GITHUB_ENV"
          echo "::warning::Duman testi başarısız — $PREV sürümüne geri alınıyor."

      - name: Geri alma dağıtımı (SSH)
        if: failure() && steps.smoke.conclusion == 'failure' && env.PREV_TAG != '' && env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH:-~/YAKITTAKIPSISTEMI}"
            git fetch origin --tags
            # OPS-1110: önce TEK KOMUTLA imaj-tabanlı geri alma (yeniden derleme yok, sıfır kesinti, migrasyon kapısı).
            # Çıkış 3 = migrasyon kapısı reddetti (contract adımı var) → yanlış sürümü zorlamayız, iş KIRMIZI kalır (MANUEL: hotfix/yedek).
            # Çıkış 1 = bu sunucuda kayıt/imaj yok (ilk kurulum, imaj temizlenmiş) → eski yol: etiketi çekip yeniden derleyerek dağıt.
            chmod +x scripts/rollback.sh scripts/zero-downtime-deploy.sh
            rc=0
            ./scripts/rollback.sh "${{ env.PREV_TAG }}" || rc=$?
            if [ "$rc" = "0" ]; then
              git checkout "${{ env.PREV_TAG }}" -- frontend nginx
            elif [ "$rc" = "1" ]; then
              echo "rollback.sh kayıt/imaj bulamadı — etiketten yeniden dağıtılıyor."
              git reset --hard "${{ env.PREV_TAG }}"
              chmod +x scripts/zero-downtime-deploy.sh
              ./scripts/zero-downtime-deploy.sh
            else
              echo "rollback.sh reddetti (çıkış $rc) — MANUEL müdahale: docs/DEPLOY_ROLLBACK.md §5"
              exit "$rc"
            fi
            # RES-907: frontend sürüm etiketi = geri alınan sürüm (backend release ile aynı)
            APP_VERSION="${{ env.PREV_TAG }}" docker compose up -d --build frontend

      # Başarılı dağıtımın değişiklik günlüğü: önceki etiket → bu etiket arası conventional commit'ler.
      - name: GitHub Release (değişiklik günlüğü + onaylayan)
        if: success()
        env:
          APPROVERS: ${{ steps.approvals.outputs.approvers }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${TAG}^" 2>/dev/null || true)
          FROM_ARG=""; [ -n "$PREV" ] && FROM_ARG="--from $PREV"
          # shellcheck disable=SC2086
          node scripts/generate-changelog.mjs $FROM_ARG --to "$TAG" --version "$TAG" > release-notes.md
          printf '\n---\nOnaylayan(lar): %s — dağıtımı tetikleyen: @%s\n' "$APPROVERS" "$GITHUB_ACTOR" >> release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag

  load-test:
    name: 🔥 TEST-1002 k6 Yük ve Stres Testi (yalnızca manuel tetikleme)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # scripts/load-test/README.md'nin belgelediği gibi tamamen compose ağında
    # container-to-container çalışır (host firewall/NFS bind-mount kısıtları
    # bu makineye özgüydü, GitHub Actions runner'ında geçerli değil ama aynı
    # script değişmeden burada da çalışıyor) — repo kökünde bir .env ve ayakta
    # bir docker compose yığını gerektirir, ikisini de bu job kendisi kurar.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build minimal .env for docker compose
        run: |
          cat > .env << EOF
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=yakittakip_db
          JWT_SECRET=ci_only_loadtest_access_${{ github.run_id }}
          JWT_REFRESH_SECRET=ci_only_loadtest_refresh_${{ github.run_id }}
          MQTT_USERNAME=ci_only_loadtest_mqtt
          MQTT_PASSWORD=ci_only_loadtest_mqtt_pass
          HW_SECRET_ESP32_PUMP_01=ci_only_hw_secret_pump_${{ github.run_id }}
          HW_SECRET_ESP32_TANK_01=ci_only_hw_secret_tank_${{ github.run_id }}
          HW_SECRET_ESP32_FLOW_ISR=ci_only_hw_secret_flow_${{ github.run_id }}
          TRANSACTION_HASH_SECRET=ci_only_tx_hash_${{ github.run_id }}
          HW_SECRET_ENCRYPTION_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TENANT_EXPORT_ENCRYPTION_KEY=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          NOTIFICATION_CHANNEL_ENCRYPTION_KEY=cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          EOF

      - name: Start Full Docker Compose Stack
        run: |
          docker compose up -d --build
          echo "postgres/redis/emqx/backend sağlıklı olana kadar bekleniyor..."
          for i in $(seq 1 60); do
            docker compose ps backend | grep -q "healthy" && echo "Backend healthy after ${i}0s" && exit 0
            sleep 10
          done
          docker compose logs backend --tail 100
          exit 1

      - name: Apply Database Schema & Seed Data
        run: |
          # ON_ERROR_STOP=1: olmadan bozuk SQL'de de exit 0 döner (TEST_PLAN §4).
          docker compose exec -T postgres psql -U postgres -d yakittakip_db -v ON_ERROR_STOP=1 < backend/src/db/schema.sql
          docker compose exec -T postgres psql -U postgres -d yakittakip_db -v ON_ERROR_STOP=1 < backend/src/db/seed_mock_data.sql

      - name: Run TEST-1002 Full AC Load Test (100 pompa @ 1000 rps, 90s)
        run: |
          chmod +x scripts/load-test/run.sh
          TARGET_RPS=1000 DEVICE_COUNT=300 DURATION=90s VUS=200 scripts/load-test/run.sh

      - name: Upload Load Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-1002-load-test-results
          path: scripts/load-test/results/
          retention-days: 14
