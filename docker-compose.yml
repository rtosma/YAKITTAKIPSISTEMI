# ==============================================================================
# Docker Compose — Yakıt Takip Sistemi
# Servisler: PostgreSQL, Redis, EMQX (MQTT), Backend (Node.js), Frontend (Nginx)
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: yakittakip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-yakittakip_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-initialize schema on first startup
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yakittakip_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - yakit_network

  # --------------------------------------------------------------------------
  # Redis - Cache & State Management (for LWT & IoT Device States)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: yakittakip_redis
    restart: unless-stopped
    # AOF (Append Only File) etkin: refresh token store + IoT cihaz durumu
    # Redis'te tutulduğu için, bir crash'te yalnızca RDB snapshot'ına güvenmek
    # (varsayılan: 60 sn'de 10000 / 300 sn'de 100 / 1 saatte 1 yazım) son
    # ~1 saate kadar yazımı kaybettirebilir → tüm kullanıcılar toplu logout.
    # everysec fsync ile kayıp en fazla ~1 sn'ye iner.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yakit_network

  # --------------------------------------------------------------------------
  # EMQX - High Performance MQTT v5 Broker
  # --------------------------------------------------------------------------
  emqx:
    build:
      context: ./docker/emqx
    container_name: yakittakip_emqx
    restart: unless-stopped
    ports:
      - "1883:1883"     # MQTT/TCP
      - "8083:8083"     # MQTT/WebSocket
      - "18083:18083"   # Dashboard
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASS:-public}
      # Anonymous MQTT access is intentionally NOT allowed: without it, anyone
      # on the network could publish fake pump/tank telemetry or subscribe to
      # every tenant's live data with zero credentials. Instead, a single
      # username/password is seeded from .env by docker/emqx/entrypoint.sh —
      # see that file for why. The backend connects with these same values
      # (MQTT_USERNAME/MQTT_PASSWORD, wired into mqttClient.ts).
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME .env dosyasında tanımlanmalıdır}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD .env dosyasında tanımlanmalıdır}
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__NAME: plain
      EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE: /opt/emqx/data/authn_bootstrap.csv
      EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE: plain
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - emqxdata:/opt/emqx/data
    networks:
      - yakit_network

  # --------------------------------------------------------------------------
  # Backend — Node.js Express API Server
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # OPS-1102: kasıtlı olarak sabit bir container_name YOK. Docker Compose,
    # container_name sabitlenmiş bir servisi 1'in üzerinde ölçeklendirmeyi
    # reddeder ("cannot scale service to more than 1"); scripts/zero-downtime-deploy.sh
    # ise tam olarak bunu yapıyor — eski konteyner ayakta ve trafik alırken
    # yeni imajla ikinci bir backend konteyneri başlatıp (scale=2, --no-recreate)
    # sağlıklı olduğunu doğruladıktan sonra eskisini kaldırıyor. Compose bu
    # servisi kendi ürettiği adla (ör. yakittakipsistemi-backend-1) izliyor;
    # günlük `docker exec`/`docker logs` için `docker compose ps -q backend`
    # kullanın.
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-yakittakip_db}
      # No insecure default here on purpose: the backend now fails fast at
      # startup if these are missing (ARCH-110 — see backend/src/config/env.ts).
      # Set real, random values in your .env — copy .env.example and edit it.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env dosyasında tanımlanmalıdır}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET .env dosyasında tanımlanmalıdır}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQTT_URL: mqtt://emqx:1883
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME .env dosyasında tanımlanmalıdır}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD .env dosyasında tanımlanmalıdır}
      # OPS-1105: önceden hardwareAuthMiddleware.ts'te düz metin sabit kodluydu.
      HW_SECRET_ESP32_PUMP_01: ${HW_SECRET_ESP32_PUMP_01:?HW_SECRET_ESP32_PUMP_01 .env dosyasında tanımlanmalıdır}
      HW_SECRET_ESP32_TANK_01: ${HW_SECRET_ESP32_TANK_01:?HW_SECRET_ESP32_TANK_01 .env dosyasında tanımlanmalıdır}
      HW_SECRET_ESP32_FLOW_ISR: ${HW_SECRET_ESP32_FLOW_ISR:?HW_SECRET_ESP32_FLOW_ISR .env dosyasında tanımlanmalıdır}
      # FUEL-401.4: finalize edilen ikmal kayıtlarının değişmezlik mührü sırrı.
      TRANSACTION_HASH_SECRET: ${TRANSACTION_HASH_SECRET:?TRANSACTION_HASH_SECRET .env dosyasında tanımlanmalıdır}
      # AUTH-202.3: hardware_devices.encrypted_secret AES-256-GCM anahtarı.
      HW_SECRET_ENCRYPTION_KEY: ${HW_SECRET_ENCRYPTION_KEY:?HW_SECRET_ENCRYPTION_KEY .env dosyasında tanımlanmalıdır}
    # OPS-1102: host'a sabit "5000:5000" port yayını kasıtlı olarak KALDIRILDI.
    # 1) frontend/nginx.conf zaten backend'e dahili yakit_network üzerinden
    #    hostname ile (http://backend:5000) erişiyor — dışarıdan doğrudan
    #    erişime gerek yok, tüm trafik nginx üzerinden geçmeli.
    # 2) Sabit bir host portu, aynı anda YALNIZCA bir konteyner tarafından
    #    bağlanabilir — scripts/zero-downtime-deploy.sh'nin gerektirdiği
    #    "eski + yeni replika aynı anda ayakta" durumunu (scale=2) bu port
    #    engeller ("port is already allocated" hatası). Doğrudan host'tan API
    #    testi gerekiyorsa nginx üzerinden http://localhost:3000/api/v1/...
    #    kullanın (frontend zaten 3000:80 ile host'a açık).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - yakit_network

  # --------------------------------------------------------------------------
  # Frontend — Vite React App served via Nginx
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: yakittakip_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    # OPS-1102: backend'in tek yönlendirme hedefi host'tan bind-mount edilen
    # bu dosyada tutuluyor (nginx.conf'taki `upstream backend_pool` bloğu
    # bunu include ediyor) — böylece scripts/zero-downtime-deploy.sh, frontend
    # imajını YENİDEN DERLEMEDEN sadece bu dosyayı yazıp `nginx -s reload`
    # tetikleyerek trafiği atomik olarak eski/yeni backend repliği arasında
    # geçirebiliyor.
    volumes:
      - ./nginx/backend_upstream.conf:/etc/nginx/backend_upstream.conf:ro
    depends_on:
      - backend
    networks:
      - yakit_network

# ==============================================================================
# Docker Volumes & Networks
# ==============================================================================
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  emqxdata:
    driver: local

networks:
  yakit_network:
    driver: bridge
