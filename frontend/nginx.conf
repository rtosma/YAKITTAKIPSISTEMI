# OPS-1102 — sıfır kesintili dağıtım için tek, adlandırılmış bir upstream
# hedefi. `server` satırı /etc/nginx/backend_upstream.conf'tan include
# ediliyor (bkz. nginx/backend_upstream.conf, docker-compose.yml'de bir
# volume ile buraya bağlanıyor) — bu dosya normalde durağan Compose servis
# takma adına (backend:5000) işaret eder; scripts/zero-downtime-deploy.sh bir
# dağıtım sırasında onu GEÇİCİ olarak yeni repliğin kendi konteyner adına
# yeniden yazıp `nginx -s reload` tetikleyerek trafiği TEK bir config
# yeniden yükleme adımında atomik olarak eskiden yeniye geçirir — DNS
# round-robin zamanlamasına güvenilmez.
upstream backend_pool {
    include /etc/nginx/backend_upstream.conf;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Cache static assets aggressively (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy API requests to backend container
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        # FLEET-1409: nginx'in varsayılanı (1MB) araç belgesi yüklemesini
        # (10MB dosya, base64'e çevrilince ~13.3MB) index.ts'teki Express
        # gövde ayrıştırıcısına ULAŞMADAN 413 ile reddederdi — backend'deki
        # 15mb sınırıyla AYNI değer.
        client_max_body_size 15m;
    }

    # FE-801: Socket.io — WebSocket upgrade + long-lived connection. Separate
    # from /api/ above because it needs the Upgrade/Connection headers and a
    # much longer read timeout (a live socket, not a request/response call).
    location /socket.io/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
    }

    # SPA fallback — serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # TEST_PLAN.md §5.1 — Content-Security-Policy (OWASP A03/A05).
    #
    # NEDEN önemli: access/refresh token'lar localStorage'da tutuluyor
    # (AppContext.tsx), yani bir XSS doğrudan oturum ele geçirmeye dönüşür.
    # CSP, XSS'e karşı SON savunma hattıdır — script enjekte edilse bile
    # tarayıcının onu çalıştırmasını/veri sızdırmasını engeller.
    #
    # Her direktif ÖLÇÜLEREK seçildi (tahminle değil):
    #   script-src 'self'        → build çıktısında inline script YOK
    #                              (dist/index.html yalnızca harici bundle
    #                              yükler), bu yüzden 'unsafe-inline' ya da
    #                              'unsafe-eval' GEREKMİYOR. En güçlü hâli.
    #   style-src  'unsafe-inline' → React'in style={{...}} prop'u (2 dosyada
    #                              kullanılıyor) inline style üretir; ayrıca
    #                              Google Fonts stylesheet'i harici.
    #   font-src                 → fonts.gstatic.com (Google Fonts dosyaları)
    #   img-src data: blob:      → base64 doküman önizleme (FLEET-1409) ve
    #                              URL.createObjectURL ile indirme (ArchivePage)
    #   connect-src ws: wss:     → Socket.io canlı bağlantısı (FE-801)
    #   object-src 'none'        → eklenti/Flash yüzeyi tamamen kapalı
    #   frame-ancestors 'self'   → X-Frame-Options SAMEORIGIN'in modern karşılığı
    #   base-uri / form-action   → enjekte edilen <base>/<form> ile veri
    #                              kaçırmayı engeller
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
}
