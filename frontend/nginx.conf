# OPS-1102 — sıfır kesintili dağıtım için tek, adlandırılmış bir upstream
# hedefi. `server` satırı /etc/nginx/backend_upstream.conf'tan include
# ediliyor (bkz. nginx/backend_upstream.conf, docker-compose.yml'de bir
# volume ile buraya bağlanıyor) — bu dosya normalde durağan Compose servis
# takma adına (backend:5000) işaret eder; scripts/zero-downtime-deploy.sh bir
# dağıtım sırasında onu GEÇİCİ olarak yeni repliğin kendi konteyner adına
# yeniden yazıp `nginx -s reload` tetikleyerek trafiği TEK bir config
# yeniden yükleme adımında atomik olarak eskiden yeniye geçirir — DNS
# round-robin zamanlamasına güvenilmez.
upstream backend_pool {
    include /etc/nginx/backend_upstream.conf;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Cache static assets aggressively (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy API requests to backend container
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # FE-801: Socket.io — WebSocket upgrade + long-lived connection. Separate
    # from /api/ above because it needs the Upgrade/Connection headers and a
    # much longer read timeout (a live socket, not a request/response call).
    location /socket.io/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
    }

    # SPA fallback — serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
